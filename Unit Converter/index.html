<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><h1>Unit <span>Converter</span></h1><p>Everyday conversions. Clearly defined units.</p></div><div class="themes" aria-label="Color theme"><button data-theme="light" aria-label="Light theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button data-theme="dark" aria-label="Dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4a9 9 0 1 0 11.5 11.5Z"/></svg></button><button data-theme="system" aria-label="System theme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button></div></header><section class="converter"><label for="category">Category</label><select id="category"></select><div class="conversion-row"><div><label for="value">Value</label><input id="value" type="text" inputmode="decimal" value="1" spellcheck="false"><label for="from">From</label><select id="from"></select></div><button id="swap" aria-label="Swap units" title="Swap units" data-icon="swap"></button><div><label for="to">To</label><select id="to"></select><div class="result"><small>Result</small><output id="result" aria-live="polite">—</output></div></div></div><p id="relationship"></p><p id="status" role="status"></p><div class="actions"><button id="copy" data-icon="file" data-icon-label="Copy result"></button><button id="reset" data-icon="undo" data-icon-label="Reset"></button></div></section><details class="settings"><summary>Display settings</summary><label>Precision mode <select id="mode"><option value="significant">Significant figures</option><option value="decimal">Decimal places</option></select></label><label id="digitsLabel">Digits <input id="digits" type="number" min="1" max="15" value="8"></label><p>Calculation retains JavaScript numeric precision. ≈ means the displayed value was rounded.</p></details><details id="all"><summary>All units for this value</summary><div class="table-scroll"><table><thead><tr><th>Unit</th><th>Result</th></tr></thead><tbody id="units"></tbody></table></div></details><div id="fallback" hidden><label for="copyFallback">Clipboard unavailable. Copy the selected text manually.</label><textarea id="copyFallback" readonly></textarea><button id="closeFallback">Close</button></div><footer>Input values are never saved. <a href="README.md">Units, definitions & guide</a></footer></main><script src="icons.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
