<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter & Viewer</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><h1>JSON Formatter <span>& Viewer</span></h1><p>Make sense of your JSON. Everything stays on your device.</p></div><div class="themes" aria-label="Color theme"><button data-theme="light" aria-label="Light theme" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button data-theme="dark" aria-label="Dark theme" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4a9 9 0 1 0 11.5 11.5Z"/></svg></button><button data-theme="system" aria-label="System theme" title="System"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button></div></header><nav aria-label="JSON actions"><button id="format" class="primary">Format</button><button id="minify">Minify</button><button id="copy" disabled>Copy JSON</button><button id="download" disabled>Download</button><button id="cancel" hidden>Cancel</button><button id="clear">Clear</button><details class="settings"><summary>Settings</summary><label>Indentation <select id="indent"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">Tab</option></select></label></details></nav><p id="status" role="status">Paste JSON or open a file to get started.</p><div class="workspace"><section><div class="panel-head"><h2>Input</h2><div><button id="open">Open file</button><button id="sample">Sample</button><input id="file" type="file" accept=".json,.txt,application/json,text/plain" hidden></div></div><label class="sr-only" for="source">JSON input</label><textarea id="source" placeholder='{"message": "Hello"}' spellcheck="false"></textarea><small>Drop a UTF-8 JSON file here · Ctrl/Cmd + Enter to format</small></section><section><div class="panel-head"><h2>Result</h2><div class="tabs"><button id="textTab" aria-pressed="true">Text</button><button id="treeTab" aria-pressed="false">Tree</button></div></div><pre id="output" tabindex="0" aria-label="Formatted JSON"></pre><div id="treePanel" hidden><div class="tree-tools"><label class="sr-only" for="search">Search keys and values</label><input id="search" placeholder="Search keys or values"><button id="previous" aria-label="Previous match">↑</button><button id="next" aria-label="Next match">↓</button><button id="collapse">Collapse all</button><button id="expand">Expand all</button></div><small id="searchStatus" role="status"></small><div id="tree"></div><button id="more" hidden>Show 500 more nodes</button></div></section></div><div id="fallback" hidden><label for="copyFallback">Clipboard unavailable. Select and copy this text manually.</label><textarea id="copyFallback" readonly></textarea><button id="closeFallback">Close</button></div><footer>Private by default. JSON is never automatically saved. <a href="README.md">Guide & limits</a></footer></main><script src="core.js"></script><script src="icons.js"></script><script src="app.js"></script></body></html>
